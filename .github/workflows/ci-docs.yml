name: CI Documentation Checks

on:
  # CI-PAUSED: the automatic triggers below are commented out until the
  # pipeline is fixed. Run this workflow by hand from the Actions tab if
  # needed. To switch it back on, uncomment the lines marked "#~".
  #~push:
  #~  branches:
  #~    - main
  #~pull_request:
  workflow_dispatch:

jobs:
  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # This is the GitHub Actions-friendly port of the linter used in the Makefile.
      - uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes" # errors only.
          config-file: ".github/workflows/markdownlint-config.json"
          check-modified-files-only: ${{ github.event_name == 'pull_request' && 'yes' || 'no' }}
          base-branch: "main"
