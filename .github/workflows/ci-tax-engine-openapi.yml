# Update OpenAPI docs so that they remain up to date with the application
name: Update OpenAPI Docs

on:
  # CI-PAUSED: the automatic triggers below are commented out until the
  # pipeline is fixed. Run this workflow by hand from the Actions tab if
  # needed. To switch it back on, uncomment the lines marked "#~".
  #~pull_request:
  #~  paths:
  #~    - tax-engine/**
  #~    - Makefile
  #~    - .github/workflows/ci-tax-engine-openapi.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: ./tax-engine

# Only trigger run one update of the OpenAPI spec at a time on the branch.
# If new commits are pushed to the branch, cancel in progress runs and start
# a new one.
concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true


jobs:
  update-openapi-docs:
    runs-on: ubuntu-latest
    # This job commits the regenerated spec back to the pull request branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout the feature branch associated with the pull request
          ref: ${{ github.head_ref }}

      - name: Update OpenAPI spec
        run: make openapi-spec

      - name: Push changes
        run: |
          git config user.name nava-platform-bot
          git config user.email platform-admins@navapbc.com
          git add --all
          # Commit changes (if no changes then no-op)
          git diff-index --quiet HEAD || git commit -m "Update OpenAPI spec"
          git push
