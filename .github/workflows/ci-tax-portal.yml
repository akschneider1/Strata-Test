name: CI tax-portal

on:
  # CI-PAUSED: the automatic triggers below are commented out until the
  # pipeline is fixed. Run this workflow by hand from the Actions tab if
  # needed. To switch it back on, uncomment the lines marked "#~".
  #~push:
  #~  branches:
  #~    - main
  #~  paths:
  #~    - tax-portal/**
  #~    - .github/workflows/ci-tax-portal.yml
  #~pull_request:
  #~  paths:
  #~    - tax-portal/**
  #~    - .github/workflows/ci-tax-portal.yml
  workflow_dispatch:

defaults:
  run:
    working-directory: ./tax-portal

jobs:
  # As an enhancement, it is possible to share the built docker image and share
  # it across jobs as described in:
  # https://docs.github.com/en/actions/using-workflows/storing-workflow-data-as-artifacts#passing-data-between-jobs-in-a-workflow
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # https://github.com/docker/compose/issues/1973
      - name: Create required env files
        working-directory: ./
        run: |
          touch ./tax-portal/.env

      - run: make lint-ci

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - run: make init-container
      - run: make precompile-assets

      - name: Start tests
        run: make test
