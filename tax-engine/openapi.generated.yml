openapi: 3.0.3
components:
  schemas:
    ValidationError:
      type: object
      properties:
        type:
          type: string
          description: The type of error
        message:
          type: string
          description: The message to return
        rule:
          type: string
          description: The rule that failed
        field:
          type: string
          description: The field that failed
        value:
          type: string
          description: The value that failed
    PaginationInfo:
      type: object
      properties:
        page_offset:
          type: integer
          description: The page number that was fetched
          example: 1
        page_size:
          type: integer
          description: The size of the page fetched
          example: 25
        total_records:
          type: integer
          description: The total number of records fetchable
          example: 42
        total_pages:
          type: integer
          description: The total number of pages that can be fetched
          example: 2
        order_by:
          type: string
          description: The field that the records were sorted by
          example: id
        sort_direction:
          description: The direction the records are sorted
          enum:
          - ascending
          - descending
    HTTPError:
      properties:
        detail:
          type: object
        message:
          type: string
      type: object
    Healthcheck:
      type: object
      properties: {}
    Role:
      type: object
      properties:
        type:
          description: The name of the role
          enum:
          - USER
          - ADMIN
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          description: The user's first name
        middle_name:
          type: string
          description: The user's middle name
        last_name:
          type: string
          description: The user's last name
        phone_number:
          type: string
          pattern: ^([0-9]|\*){3}\-([0-9]|\*){3}\-[0-9]{4}$
          description: The user's phone number
          example: 123-456-7890
        date_of_birth:
          type: string
          format: date
          description: The users date of birth
        is_active:
          type: boolean
          description: Whether the user is active
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_of_birth
      - first_name
      - is_active
      - last_name
      - phone_number
      - roles
    EngineStatus:
      type: object
      properties:
        engine:
          type: string
        engine_version:
          type: string
        ready:
          type: boolean
          description: False while the rules engine is still loading
        supported_tax_years:
          type: array
          items:
            type: integer
        qualifying_relative_income_limits:
          type: object
          description: 'By tax year: the most income a person can have and still be
            claimed as a qualifying relative'
          additionalProperties:
            type: integer
    UserSorting:
      type: object
      properties:
        order_by:
          type: string
          enum:
          - id
          - created_at
          - updated_at
          description: The field to sort the response by
        sort_direction:
          description: Whether to sort the response ascending or descending
          enum:
          - ascending
          - descending
      required:
      - order_by
      - sort_direction
    Pagination:
      type: object
      properties:
        page_size:
          type: integer
          minimum: 1
          description: The size of the page to fetch
          example: 25
        page_offset:
          type: integer
          minimum: 1
          description: The page number to fetch, starts counting from 1
          example: 1
      required:
      - page_offset
      - page_size
    UserSearch:
      type: object
      properties:
        phone_number:
          type: string
          pattern: ^([0-9]|\*){3}\-([0-9]|\*){3}\-[0-9]{4}$
          description: The user's phone number
          example: 123-456-7890
        is_active:
          type: boolean
        role_type:
          enum:
          - USER
          - ADMIN
        sorting:
          $ref: '#/components/schemas/UserSorting'
        paging:
          $ref: '#/components/schemas/Pagination'
      required:
      - paging
    Person:
      type: object
      properties:
        age:
          type: integer
          minimum: 0
          maximum: 125
          description: Age at the end of the tax year
        wages:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 10000000.0
          description: Wages, salaries and tips (Form W-2 box 1)
        unemployment_compensation:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 10000000.0
          description: Unemployment compensation (Form 1099-G box 1)
        pension_income:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 10000000.0
          description: Taxable pensions and annuities (Form 1099-R box 2a)
        social_security:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 10000000.0
          description: Social Security benefits (Form SSA-1099 box 5)
        is_blind:
          type: boolean
          default: false
      required:
      - age
    Dependent:
      type: object
      properties:
        age:
          type: integer
          minimum: 0
          maximum: 125
        is_full_time_student:
          type: boolean
          default: false
        is_disabled:
          type: boolean
          default: false
      required:
      - age
    ReturnFacts:
      type: object
      properties:
        tax_year:
          type: integer
          enum:
          - 2025
        filing_status:
          type: string
          enum:
          - SINGLE
          - JOINT
          - SEPARATE
          - HEAD_OF_HOUSEHOLD
          - SURVIVING_SPOUSE
        filer:
          $ref: '#/components/schemas/Person'
        spouse:
          default: null
          anyOf:
          - $ref: '#/components/schemas/Person'
          - type: object
            nullable: true
        dependents:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Dependent'
        taxable_interest:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 10000000.0
          description: Taxable interest (Form 1099-INT box 1)
        childcare_expenses:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 10000000.0
          description: Child care expenses paid so the filer could work
        colorado_tax_withheld:
          type: number
          default: 0.0
          minimum: 0.0
          maximum: 10000000.0
          description: Colorado income tax withheld (Form W-2 box 17 and 1099s)
      required:
      - filer
      - filing_status
      - tax_year
    Line:
      type: object
      properties:
        id:
          type: string
          description: Stable identifier for the line
        section:
          type: string
        amount:
          type: number
          description: Whole dollars
        facts:
          type: object
          description: Values that explain the amount
          additionalProperties: {}
        source_title:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
    Calculation:
      type: object
      properties:
        tax_year:
          type: integer
        filing_status:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
        refund:
          type: number
        amount_owed:
          type: number
        engine:
          type: string
          description: Rules engine that produced the result
        engine_version:
          type: string
    UserUpdate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          description: The user's first name
        middle_name:
          type: string
          description: The user's middle name
        last_name:
          type: string
          description: The user's last name
        phone_number:
          type: string
          pattern: ^([0-9]|\*){3}\-([0-9]|\*){3}\-[0-9]{4}$
          description: The user's phone number
          example: 123-456-7890
        date_of_birth:
          type: string
          format: date
          description: The users date of birth
        is_active:
          type: boolean
          description: Whether the user is active
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth

