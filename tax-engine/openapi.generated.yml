                      $ref: '#/components/schemas/ValidationError'
                  pagination_info:
                    description: The pagination information for paginated endpoints
                    allOf:
                    - $ref: '#/components/schemas/PaginationInfo'
          description: Authentication error
      tags:
      - Tax
      summary: Calculate a Colorado individual income tax return (form DR 0104).
      description: 'Takes what the taxpayer told us and returns each line of the return,

        which credits the household qualifies for, and the refund or amount owed.

        Amounts are never logged.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnFacts'
      security:
