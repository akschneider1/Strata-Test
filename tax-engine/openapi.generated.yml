info:
  title: Colorado Tax Engine (prototype)
  description: 'Calculates Colorado individual income tax returns using PolicyEngine
    US. Prototype: not for filing.'
  contact:
    name: Nava PBC Engineering
    url: https://www.navapbc.com
    email: engineering@navapbc.com
  version: 0.1.0
tags:
- name: Health
- name: User
- name: Tax
paths:
  /health:
    get:
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: The message to return
                  data:
                    $ref: '#/components/schemas/Healthcheck'
                  status_code:
                    type: integer
                    description: The HTTP status code
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationError'
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationError'
                  pagination_info:
                    description: The pagination information for paginated endpoints
                    allOf:
                    - $ref: '#/components/schemas/PaginationInfo'
          description: Successful response
        '503':
          content:
            application/json:
              schema:
                type: object
                properties:
