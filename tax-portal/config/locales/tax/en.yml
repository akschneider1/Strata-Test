# Taxpayer portal text. Written to the IRS Direct File content style guide:
# plain language, the taxpayer's own words, one idea per sentence, and no
# personal information in titles, links or buttons.
en:
  date:
    formats:
      plain: "%B %-d, %Y"
  time:
    formats:
      plain: "%B %-d, %Y at %-l:%M %p, Mountain time"
      plain_short: "%B %-d at %-l:%M %p"
  header:
    staff_title: "Colorado Department of Revenue · Examiner portal"
    signed_in_as: "Signed in as %{name}"
    signed_in_as_label: "Signed in as"
  prototype_banner:
    heading: "Prototype:"
    body: "This is a demonstration with made-up people. It can't file a real tax return."
  flash:
    not_authorized: "That page isn't available to your account."
  shared:
    "yes": "Yes"
    "no": "No"
    skip_to_content: "Skip to main content"
    continue: "Save and continue"
    back: "Back"
    back_to_checklist: "Back to checklist"
    edit: "Change"
    remove: "Remove"
    save: "Save"
    cancel: "Cancel"
    optional: "optional"
    dollars_hint: "Enter whole dollars, without cents. For example, 1250"
    why_we_ask: "Why we ask"
    source: "Where this rule comes from"
    filer: "You"
    spouse: "Your spouse"
  home:
    index:
      title: "File your 2025 Colorado income tax return"
      lead: "Answer simple questions about yourself. We fill in what the Department of Revenue already has on file. We tell you which credits you can get, and show how we worked out your tax."
      what_you_get_heading: "How this is different"
      what_you_get:
        - "We fill in your wage and income forms (W-2 and 1099). You check them."
        - "You don't pick a filing status or search for credits. We tell you what you can get, and why."
        - "You see each step of the math before you sign."
        - "You can check where your return stands at any time."
      sign_in: "Sign in"
      demo_heading: "Try the demo"
      demo_lead: "Choose a person below. You will see the portal as they see it. Everyone here is made up."
      demo_taxpayers: "People filing a tax return"
      demo_examiners: "Department of Revenue staff who review returns"
      demo_sign_in: "Continue as %{name}"
      demo_how_heading: "How the demo works"
      demo_how:
        - "Choose a person. You don't need a password."
        - "To switch to someone else, choose Log out. Then choose another person."
        - "Nothing you enter is sent to the Department of Revenue."
        - "You get your own copy of the demo. What you do doesn't change what anyone else sees."
        - "Your copy is erased after two hours without use. Then you start fresh."
      demo_loading_heading: "The demo is getting ready"
      demo_loading: "You can choose a person in about a minute. This page will update on its own."
      demo_reset_summary: "Start the demo over"
      demo_reset_lead: "This puts every demo person back to where they started, in your copy only. It erases anything you entered. Other people using the demo are not affected."
      demo_reset: "Reset the demo"
      demo_reset_done: "Your demo is back to the start."
      demo_not_ready: "The demo isn't ready yet. Wait a minute and try again."
      about_link: "About this prototype: what is real and what is made up"
    about:
      title: "About this prototype"
      lead: "This is a working model of how filing and reviewing a Colorado income tax return could work. It was built to show what is possible. It is not a Department of Revenue service, and it can't file a real return."
      can_heading: "What you can do here"
      can:
        - "File a 2025 Colorado return as a made-up person, on a phone or a computer."
        - "See forms the State already has, filled in for you."
        - "See how a refund or an amount owed was worked out, step by step."
        - "Review a return as Department staff: see why it was stopped, ask the taxpayer a question, change an amount, and have a second person confirm the change."
        - "See what the graduated tax rates voters approved for 2027 would mean for one household."
      real_heading: "What is real"
      real:
        - "The tax math. An open-source tax model, PolicyEngine, applies the 2025 federal and Colorado rules. It is not certified tax software."
        - "The questions, the checks on your answers, and saving your place, in English and Spanish."
        - "The automatic checks, the staff work list, the second approval for large changes, and the record of every action."
        - "Protection for Social Security and bank account numbers when they are stored."
      simulated_heading: "What is made up or left out"
      simulated:
        - "Every person, employer and number. Nobody here is real."
        - "The forms marked as on file. In a real service they would come from what employers and payers already send the State. That connection is not built."
        - "Signing in. One click stands in for proving who you are."
        - "Money. No refund is paid and no payment is taken."
        - "The rules for which returns a person checks, and how long refunds take. These are examples, not Department policy."
        - "Testing with taxpayers and Department staff. That has not happened yet."
      not_covered_heading: "Who it doesn't cover yet"
      not_covered:
        - "People who lived in Colorado for only part of the year."
        - "People with self-employment income or other kinds of income the start page doesn't list."
        - "People who need to change a return after filing it."
        - "People who have someone else file for them."
      copy_heading: "Your copy of the demo"
      copy: "When you choose a person, you get your own copy of the demo. What you do changes only your copy. It is erased after two hours without use, or when you choose Start the demo over."
      back: "Back to the start page"
  demo_users:
    maya: "Has not filed yet. Start here to file a return from beginning to end."
    daniela: "A single parent of two children. Her answers are already filled in. See the credits she gets, then sign her return."
    walter: "Retired and married. He has already filed. See a return that was accepted without a review."
    elena: "Owes tax this year, because too little was taken out of her pay. See a return with an amount due."
    jordan: "Said more tax was taken out of his pay than his employer reported. See a return that a person is reviewing."
    examiner: "Reviews returns that need a closer look. Start here to review Jordan's return."
    examiner2: "A second reviewer. He confirms the large changes that Priya makes."
