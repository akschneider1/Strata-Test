      pension_subtraction:
        label: "Pension and retirement income Colorado doesn't tax"
        explanation: "People 55 and older can leave out some pension, retirement and Social Security income. The limit depends on your age."
      other_subtractions:
        label: "Other income Colorado doesn't tax"
        explanation: "Other income that Colorado leaves out."
      subtractions:
        label: "Total income Colorado doesn't tax"
        explanation: "Colorado doesn't tax this income, even though the federal government does."
      colorado_taxable_income:
        label: "Income Colorado taxes"
        explanation: "The income the federal government taxes, plus what Colorado adds back, minus what Colorado doesn't tax. Its official name is Colorado taxable income."
      tax:
        label: "Colorado income tax"
        explanation: "Colorado taxes everyone at the same rate. For %{tax_year} it's %{rate} of the income Colorado taxes."
      alternative_minimum_tax:
        label: "Alternative minimum tax"
        explanation: "An extra tax that applies to very few people with certain kinds of income."
      nonrefundable_credits:
        label: "Credits that reduce your tax"
        explanation: "Credits that can lower your tax to zero but can't be paid out as a refund."
      net_tax:
        label: "Your tax after those credits"
        explanation: "Colorado income tax minus the credits above."
      earned_income_credit:
        label: "Colorado Earned Income Tax Credit"
        explanation_yes: "For people who work and have low to moderate income. Colorado's credit is a share of the federal credit you qualify for (%{federal_eitc})."
        explanation_no: "For people who work and have low to moderate income. Your income is above the limit for your family size, or you don't have income from work."
      child_tax_credit:
        label: "Colorado Child Tax Credit"
        explanation_yes: "For families with children under 6. Children under 6 on your return: %{children_under_6}. Your income is within the limit."
        explanation_no: "For families with children under 6 whose income is within the limit."
      family_affordability_credit:
        label: "Family Affordability Tax Credit"
        explanation_yes: "For families with children under 17. Children under 17 on your return: %{children_under_17}. The amount depends on each child's age and your income."
        explanation_no: "For families with children under 17 whose income is within the limit."
      child_care_credit:
        label: "Child Care Expenses Tax Credit"
        explanation_yes: "Based on the %{childcare_expenses} you paid for child care so you could work."
        explanation_no: "For people who paid for child care so they could work and whose income is within the limit."
      tabor_sales_tax_refund:
        label: "State sales tax refund"
        explanation_yes: "Some years Colorado collects more tax than the state constitution allows. It gives the extra back to people who lived here all year. This is often called the TABOR refund."
        explanation_no: "Some years Colorado collects more tax than the state constitution allows and gives the extra back. There is no refund for you this year."
      care_worker_credit:
        label: "Care Worker Tax Credit"
        explanation_yes: "For people who work in child care, home health care or long-term care."
        explanation_no: "For people who work in child care, home health care or long-term care. This prototype doesn't ask about it yet."
      refundable_credits:
        label: "Total credits and refunds"
        explanation: "You get these even if they add up to more than your tax."
      colorado_tax_withheld:
        label: "Colorado tax withheld"
        explanation: "Tax that was already taken out of your pay or benefits. It is shown on your income forms."
      refund:
        label: "Your refund"
        explanation: "Your credits and the tax already withheld add up to more than your tax. You get the difference back."
      amount_owed:
        label: "Amount you owe"
        explanation: "Your tax is more than your credits plus the tax already withheld. You owe the difference."
