    actions:
      exit: "Back to checklist"
    steps:
      filer_name: "Name"
      filer_identity: "Birth date and Social Security number"
      contact: "Address"
      residency: "Where you lived"
      marital_status: "Marital status"
      filing_jointly: "Filing together"
      spouse: "Your spouse"
      dependents: "Dependents"
      home_costs: "Home costs"
      childcare: "Child care"
      income_documents: "Income forms"
      interest: "Interest"
      other_income: "Other income"
      refund_method: "Refund or payment"
    errors:
      tax_engine_unavailable: "We couldn't calculate your return just now. Nothing was lost. Please try again in a minute."
      estimate_unavailable: "We can't show your estimate right now. You can keep working on your return, and nothing was lost."
    index:
      title: "Your %{tax_year} Colorado income tax return"
      lead: "You can stop at any time and pick up where you left off."
      need_heading: "What you'll need"
      need:
        - "Your Social Security number, and your spouse's and dependents' if you have them"
        - "Your W-2s and 1099s, to check against what we already have"
        - "Your bank routing and account number, if you want your refund by direct deposit"
      who_heading: "Who can use this prototype"
      who: "You can use this prototype if you lived in Colorado for all of %{tax_year}. Your income must come only from wages, unemployment, retirement, Social Security or bank interest."
      start: "Start my return"
    show:
      title: "Your %{tax_year} Colorado return"
      lead: "Complete each section. You can change your answers until you sign and submit."
      sections_heading: "Sections"
      estimate_refund_heading: "Estimated refund so far"
      estimate_owed_heading: "Estimated amount you owe so far"
      estimate_body: "Based on what you've told us. It can change until you submit."
      see_calculation: "See how we calculated this"
      review_and_sign: "Review and sign"
      finish_sections_first: "Complete every section to review and sign."
      cannot_start_hint: "Finish the sections above first."
      status:
        completed: "Completed"
        in_progress: "In progress"
        not_started: "Not started"
        cannot_start_yet: "Not ready yet"
      actions:
        start: "Start"
        continue: "Continue"
        edit: "Review or change"
    task_section_component:
      about_you:
        title: "About you"
        description: "Your name, birth date, Social Security number and address."
      family:
        title: "Your family"
        description: "Your marital status and the people you support. This decides your filing status and credits."
      income:
        title: "Your income"
        description: "Check the income forms we have on file for you and add anything missing."
      refund:
        title: "Refund or payment"
        description: "How you want to get your refund, or how you'll pay."
    edit_filer_name:
      title: "What's your name?"
      hint: "Use the name on your Social Security card."
    edit_filer_identity:
      title: "Your birth date and Social Security number"
      date_of_birth_legend: "Date of birth"
      ssn_label: "Social Security number"
      ssn_hint: "We use this to find the income forms your employers sent us."
    edit_contact:
      title: "Where should we send mail about your return?"
      phone_label: "Phone number"
    edit_residency:
      title: "Did you live in Colorado for all of %{tax_year}?"
      hint: "Answer yes if Colorado was your home from January 1 through December 31. Trips and work in other places don't change that."
    edit_marital_status:
      title: "On December 31, %{tax_year}, were you married?"
      options:
        unmarried: "No, I was not married"
        unmarried_hint: "Single, divorced or legally separated"
        married: "Yes, I was married"
        married_hint: "Including if your spouse died during %{tax_year}"
        widowed: "My spouse died in %{previous_year} or %{two_years_ago}"
        widowed_hint: "And I have not remarried"
    edit_filing_jointly:
      title: "Do you and your spouse want to file one return together?"
      hint: "Most married couples pay less tax when they file together. Both of you are responsible for the return."
      "yes": "Yes, file together"
      "no": "No, file separately"
    edit_spouse:
      title: "Tell us about your spouse"
      name_legend: "Your spouse's name"
      date_of_birth_legend: "Your spouse's date of birth"
      ssn_label: "Your spouse's Social Security number"
    edit_dependents:
      title: "Did anyone depend on you in %{tax_year}?"
      hint: "A dependent is usually a child or relative who lived with you. You paid most of their living costs."
      who_counts_summary: "Who counts as a dependent?"
      who_counts: "Usually your child, stepchild, foster child, grandchild, brother, sister or parent who lived with you for more than half the year and didn't pay for most of their own support. You'll answer a few questions about each person."
      list_heading: "People you've added"
      age: "Age %{age} at the end of %{tax_year}"
      add: "Add a dependent"
      add_another: "Add another dependent"
      "yes": "Yes"
      "no": "No"
    edit_home_costs:
      title: "Did you pay more than half the cost of keeping up your home in %{tax_year}?"
      hint: "Count rent or mortgage, utilities, repairs, property tax and food eaten at home."
      why: "If you did, you can use a filing status with a larger deduction."
    edit_childcare:
      title: "Did you pay for child care so you could work or look for work?"
      hint: "Count day care, preschool, care before and after school, and day camp for a child under 13. Also count care for a dependent who can't care for themselves."
      amount_label: "How much did you pay in %{tax_year}? (in dollars)"
    edit_income_documents:
      title: "Check your income forms"
      lead: "Employers and other payers send copies of these forms to the Department of Revenue. Compare each one with your own copy. \"Withheld\" means tax that was already taken out of your pay or benefits."
