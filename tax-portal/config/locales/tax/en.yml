    edit_other_income:
      title: "Did you have any other income in %{tax_year}?"
      hint: "For example: money from your own business or gig work, rent, selling stocks or property, or income from another state."
    edit_refund_method:
      title: "How do you want to get a refund or pay?"
      lead: "If you're due a refund, direct deposit is the fastest way to get it. If you owe, we'll show you how to pay after you submit."
      options:
        direct_deposit: "Direct deposit to my bank account"
        direct_deposit_hint: "Usually within 7 to 10 days"
        check: "Mail me a paper check"
        check_hint: "Can take 3 to 4 weeks"
      account_type_legend: "Type of account"
      checking: "Checking"
      savings: "Savings"
      routing_label: "Routing number"
      routing_hint: "9 digits, at the bottom left of a check"
      account_label: "Account number"
