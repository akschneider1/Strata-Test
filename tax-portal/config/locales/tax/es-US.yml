        explanation: "Ingresos que Colorado grava pero el gobierno federal no. La mayoría de las personas no tiene ninguna."
      pension_subtraction:
        label: "Ingresos de pensión y jubilación que Colorado no grava"
        explanation: "Colorado permite que las personas de 55 años o más resten ingresos de pensión, jubilación y Seguro Social tributable, hasta un límite que depende de la edad."
      other_subtractions:
        label: "Otras sustracciones de Colorado"
        explanation: "Otros ingresos que Colorado no grava."
      subtractions:
        label: "Total de sustracciones de Colorado"
        explanation: "Ingresos que el gobierno federal grava pero Colorado no."
      colorado_taxable_income:
        label: "Ingreso tributable de Colorado"
        explanation: "Ingreso tributable federal, más adiciones, menos sustracciones."
      tax:
        label: "Impuesto sobre el ingreso de Colorado"
        explanation: "Colorado grava a todos con la misma tasa. Para %{tax_year} es %{rate} de su ingreso tributable de Colorado."
      alternative_minimum_tax:
        label: "Impuesto mínimo alternativo"
        explanation: "Un impuesto adicional que aplica a muy pocas personas con ciertos tipos de ingresos."
      nonrefundable_credits:
        label: "Créditos que reducen su impuesto"
        explanation: "Créditos que pueden bajar su impuesto a cero pero no se pagan como reembolso."
      net_tax:
        label: "Su impuesto antes de los créditos reembolsables"
        explanation: "Impuesto sobre el ingreso de Colorado menos los créditos anteriores."
      earned_income_credit:
        label: "Crédito Tributario por Ingreso del Trabajo de Colorado"
        explanation_yes: "Para personas que trabajan y tienen ingresos bajos o moderados. El crédito de Colorado es una parte del crédito federal al que tiene derecho (%{federal_eitc})."
        explanation_no: "Para personas que trabajan y tienen ingresos bajos o moderados. Su ingreso supera el límite para el tamaño de su familia, o no tiene ingresos del trabajo."
      child_tax_credit:
        label: "Crédito Tributario por Hijos de Colorado"
        explanation_yes: "Para familias con hijos menores de 6 años. Usted tiene %{children_under_6} y su ingreso está dentro del límite."
        explanation_no: "Para familias con hijos menores de 6 años cuyo ingreso está dentro del límite."
      family_affordability_credit:
        label: "Crédito Tributario de Asequibilidad Familiar"
        explanation_yes: "Para familias con hijos menores de 17 años. Usted tiene %{children_under_17}, y la cantidad depende de la edad de cada hijo y de su ingreso."
        explanation_no: "Para familias con hijos menores de 17 años cuyo ingreso está dentro del límite."
      child_care_credit:
        label: "Crédito Tributario por Gastos de Cuidado de Niños"
        explanation_yes: "Basado en los %{childcare_expenses} que pagó por cuidado de niños para poder trabajar."
        explanation_no: "Para personas que pagaron por cuidado de niños para poder trabajar y cuyo ingreso está dentro del límite."
      tabor_sales_tax_refund:
        label: "Reembolso del impuesto estatal sobre las ventas (TABOR)"
        explanation_yes: "Cuando Colorado recauda más de lo que permite la constitución estatal, devuelve el excedente a los residentes de todo el año por medio de sus declaraciones."
        explanation_no: "Cuando Colorado recauda más de lo que permite la constitución estatal, devuelve el excedente a los residentes de todo el año. Este año no hay reembolso para usted."
      care_worker_credit:
        label: "Crédito Tributario para Trabajadores de Cuidado"
        explanation_yes: "Para personas que trabajan en cuidado infantil, atención médica en el hogar o cuidado a largo plazo."
        explanation_no: "Para personas que trabajan en cuidado infantil, atención médica en el hogar o cuidado a largo plazo. Este prototipo aún no pregunta sobre esto."
      refundable_credits:
        label: "Total de créditos y reembolsos"
        explanation: "Se le pagan aunque sean mayores que su impuesto."
      colorado_tax_withheld:
        label: "Impuesto de Colorado que ya se descontó de su pago"
        explanation: "La retención de Colorado en sus formularios de ingresos."
      refund:
        label: "Su reembolso"
        explanation: "Pagó o se le acreditó más que su impuesto, así que recibe la diferencia."
      amount_owed:
        label: "Cantidad que debe"
        explanation: "Su impuesto es mayor que sus créditos y lo que se le retuvo."
