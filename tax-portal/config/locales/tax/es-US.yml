      copies: "Copias de la demostración en uso"
      reading_heading: "Cómo leer esto"
      reading:
        - "Cada página hace de 10 a 20 viajes a la base de datos. Si un viaje tarda más de unos pocos milisegundos, la base de datos está en otra máquina y todas las páginas son lentas. Ejecute la demostración con su propia base de datos: vea docs/hosting.md."
        - "Si un cálculo nuevo tarda varios segundos, el procesador es lento. Las personas de la demostración se calculan por adelantado, así que siguen siendo rápidas. Una declaración que usted escribe espera un cálculo en la lista y en la revisión."
        - "Si queda poca memoria libre, la máquina es demasiado pequeña y todo se vuelve lento. El motor de impuestos necesita unos 3 GB."
