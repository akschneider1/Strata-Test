  home:
    index:
      title: "Presente su declaración de impuestos de Colorado de 2025"
      lead: "Responda preguntas sencillas sobre usted. Completamos lo que el Departamento de Hacienda ya tiene registrado. Le decimos qué créditos puede recibir y le mostramos cómo calculamos su impuesto."
      what_you_get_heading: "En qué es diferente"
      what_you_get:
        - "Completamos sus formularios de salarios e ingresos (W-2 y 1099). Usted los revisa."
        - "No tiene que elegir un estado civil para la declaración ni buscar créditos. Le decimos qué puede recibir y por qué."
        - "Ve cada paso del cálculo antes de firmar."
        - "Puede ver en qué va su declaración en cualquier momento."
      sign_in: "Iniciar sesión"
      demo_heading: "Pruebe la demostración"
      demo_lead: "Elija a una persona abajo. Verá el portal como lo ve esa persona. Todas las personas son ficticias."
      demo_taxpayers: "Personas que presentan una declaración"
      demo_examiners: "Personal del Departamento de Hacienda que revisa declaraciones"
      demo_sign_in: "Continuar como %{name}"
      demo_how_heading: "Cómo funciona la demostración"
      demo_how:
        - "Elija a una persona. No necesita contraseña."
        - "Para cambiar de persona, elija Cerrar sesión. Luego elija a otra persona."
        - "Nada de lo que escriba se envía al Departamento de Hacienda."
        - "Usted recibe su propia copia de la demostración. Lo que haga no cambia lo que ven otras personas."
        - "Su copia se borra después de dos horas sin uso. Luego empieza de nuevo."
      demo_loading_heading: "La demostración se está preparando"
      demo_loading: "Podrá elegir a una persona en aproximadamente un minuto. Esta página se actualizará sola."
      demo_reset_summary: "Empezar la demostración de nuevo"
      demo_reset_lead: "Esto devuelve a cada persona de la demostración a su punto de partida, solo en su copia. Borra todo lo que usted escribió. No afecta a otras personas que usan la demostración."
      demo_reset: "Reiniciar la demostración"
      demo_reset_done: "Su demostración volvió al inicio."
      demo_not_ready: "La demostración aún no está lista. Espere un minuto e inténtelo de nuevo."
      about_link: "Acerca de este prototipo: qué es real y qué es ficticio"
    about:
      title: "Acerca de este prototipo"
      lead: "Este es un modelo que funciona de cómo podría ser presentar y revisar una declaración de impuestos sobre los ingresos de Colorado. Se creó para mostrar lo que es posible. No es un servicio del Departamento de Hacienda y no puede presentar una declaración real."
      can_heading: "Lo que puede hacer aquí"
      can:
        - "Presentar una declaración de Colorado de 2025 como una persona ficticia, en un teléfono o una computadora."
        - "Ver formularios que el Estado ya tiene, llenados para usted."
        - "Ver paso a paso cómo se calculó un reembolso o una cantidad que se debe."
        - "Revisar una declaración como personal del Departamento: ver por qué se detuvo, hacerle una pregunta al contribuyente, cambiar una cantidad y pedir que otra persona confirme el cambio."
        - "Ver lo que significarían para un hogar las tasas graduadas que los votantes aprobaron para 2027."
      real_heading: "Lo que es real"
      real:
        - "Los cálculos de impuestos. Un modelo de impuestos de código abierto, PolicyEngine, aplica las reglas federales y de Colorado de 2025. No es un programa de impuestos certificado."
        - "Las preguntas, la revisión de sus respuestas y guardar su avance, en inglés y en español."
        - "Las revisiones automáticas, la lista de trabajo del personal, la segunda aprobación para cambios grandes y el registro de cada acción."
        - "La protección de los números de Seguro Social y de cuentas bancarias cuando se guardan."
      simulated_heading: "Lo que es ficticio o falta"
      simulated:
        - "Cada persona, empleador y número. Nadie aquí es real."
        - "Los formularios marcados como registrados. En un servicio real vendrían de lo que los empleadores y pagadores ya envían al Estado. Esa conexión no está hecha."
        - "Iniciar sesión. Un clic reemplaza la comprobación de su identidad."
        - "El dinero. No se paga ningún reembolso ni se recibe ningún pago."
        - "Las reglas sobre qué declaraciones revisa una persona y cuánto tardan los reembolsos. Son ejemplos, no políticas del Departamento."
        - "Pruebas con contribuyentes y con personal del Departamento. Aún no se han hecho."
      not_covered_heading: "A quién no cubre todavía"
      not_covered:
        - "Personas que vivieron en Colorado solo parte del año."
        - "Personas con ingresos de trabajo por cuenta propia u otros tipos de ingresos que la página de inicio no menciona."
        - "Personas que necesitan cambiar una declaración después de presentarla."
        - "Personas a quienes otra persona les presenta la declaración."
      copy_heading: "Su copia de la demostración"
      copy: "Cuando elige a una persona, recibe su propia copia de la demostración. Lo que haga cambia solo su copia. Se borra después de dos horas sin uso, o cuando elige Empezar la demostración de nuevo."
      back: "Volver a la página de inicio"
