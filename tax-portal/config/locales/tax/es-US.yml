# Texto del portal del contribuyente en español.
# Borrador de prototipo: debe revisarlo un traductor profesional antes de
# usarse con el público (práctica de IRS Direct File).
es-US:
  date:
    formats:
      plain: "%-d de %B de %Y"
    month_names: [~, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
