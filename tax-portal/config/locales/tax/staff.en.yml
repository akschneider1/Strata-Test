  # Wording for the Strata SDK's work queue (overrides the SDK's defaults)
  strata:
    staff:
      header:
        tasks: "Work queue"
    tasks:
      actions:
        pick_next: "Pick up next return"
      messages:
        no_tasks_available: "No returns are waiting to be picked up."
